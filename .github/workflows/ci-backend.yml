name: CI - Backend

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: test_newsdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov pylint bandit flake8

    - name: Run migrations
      run: |
        cd backend
        python manage.py migrate --settings=myproject.settings
      env:
        DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_newsdb
        DEBUG: 'False'
        SECRET_KEY: test-secret-key

    - name: Lint with pylint
      run: |
        cd backend
        pylint myproject members mynews --disable=all --enable=E,F || true

    - name: Lint with flake8
      run: |
        cd backend
        flake8 . --max-line-length=100 --exclude=migrations,venv --count --show-source --statistics

    - name: Security check with bandit
      run: |
        cd backend
        bandit -r . -ll -i || true

    - name: Run Django tests
      run: |
        cd backend
        python manage.py test --settings=myproject.settings
      env:
        DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_newsdb
        DEBUG: 'False'
        SECRET_KEY: test-secret-key

    - name: Check with Django's check command
      run: |
        cd backend
        python manage.py check --settings=myproject.settings

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./docker/backend.Dockerfile
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

  notify:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: always()

    steps:
    - name: Send Slack notification
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Backend CI failed on ${{ github.ref }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
