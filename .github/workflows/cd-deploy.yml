name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      consumer-image: ${{ steps.meta-consumer.outputs.tags }}
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.REGISTRY_URL }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    # Consumer 이미지 빌드 & 푸시
    - name: Build and push Consumer image
      uses: docker/build-push-action@v4
      id: docker_consumer
      with:
        context: .
        file: ./docker/consumer.Dockerfile
        push: true
        tags: |
          ${{ secrets.REGISTRY_URL }}/news-consumer:latest
          ${{ secrets.REGISTRY_URL }}/news-consumer:${{ github.sha }}
          ${{ secrets.REGISTRY_URL }}/news-consumer:v${{ github.run_number }}
        cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/news-consumer:buildcache
        cache-to: type=registry,ref=${{ secrets.REGISTRY_URL }}/news-consumer:buildcache,mode=max

    - name: Consumer image metadata
      id: meta-consumer
      run: |
        echo "tags=${{ secrets.REGISTRY_URL }}/news-consumer:${{ github.sha }}" >> $GITHUB_OUTPUT

    # Backend 이미지 빌드 & 푸시
    - name: Build and push Backend image
      uses: docker/build-push-action@v4
      id: docker_backend
      with:
        context: ./backend
        file: ./docker/backend.Dockerfile
        push: true
        tags: |
          ${{ secrets.REGISTRY_URL }}/news-backend:latest
          ${{ secrets.REGISTRY_URL }}/news-backend:${{ github.sha }}
          ${{ secrets.REGISTRY_URL }}/news-backend:v${{ github.run_number }}
        cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/news-backend:buildcache
        cache-to: type=registry,ref=${{ secrets.REGISTRY_URL }}/news-backend:buildcache,mode=max

    - name: Backend image metadata
      id: meta-backend
      run: |
        echo "tags=${{ secrets.REGISTRY_URL }}/news-backend:${{ github.sha }}" >> $GITHUB_OUTPUT

    # Frontend 이미지 빌드 & 푸시
    - name: Build and push Frontend image
      uses: docker/build-push-action@v4
      id: docker_frontend
      with:
        context: ./frontend-react
        file: ./docker/frontend.Dockerfile
        push: true
        tags: |
          ${{ secrets.REGISTRY_URL }}/news-frontend:latest
          ${{ secrets.REGISTRY_URL }}/news-frontend:${{ github.sha }}
          ${{ secrets.REGISTRY_URL }}/news-frontend:v${{ github.run_number }}
        cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/news-frontend:buildcache
        cache-to: type=registry,ref=${{ secrets.REGISTRY_URL }}/news-frontend:buildcache,mode=max

    - name: Frontend image metadata
      id: meta-frontend
      run: |
        echo "tags=${{ secrets.REGISTRY_URL }}/news-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

  security-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - consumer
          - backend
          - frontend

    steps:
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.REGISTRY_URL }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.REGISTRY_URL }}/news-${{ matrix.image }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  staging-deploy:
    needs: [build-and-push, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Staging
      run: |
        # SSH로 staging 서버에 접속하여 배포
        mkdir -p ~/.ssh
        echo "${{ secrets.STAGING_DEPLOY_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

        ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
        cd /app/news_pipeline
        
        # 이미지 가져오기
        docker pull ${{ secrets.REGISTRY_URL }}/news-consumer:${{ github.sha }}
        docker pull ${{ secrets.REGISTRY_URL }}/news-backend:${{ github.sha }}
        docker pull ${{ secrets.REGISTRY_URL }}/news-frontend:${{ github.sha }}
        
        # 환경 변수 설정
        export CONSUMER_IMAGE=${{ secrets.REGISTRY_URL }}/news-consumer:${{ github.sha }}
        export BACKEND_IMAGE=${{ secrets.REGISTRY_URL }}/news-backend:${{ github.sha }}
        export FRONTEND_IMAGE=${{ secrets.REGISTRY_URL }}/news-frontend:${{ github.sha }}
        
        # 배포
        docker-compose -f docker-compose.staging.yml down || true
        docker-compose -f docker-compose.staging.yml up -d
        
        # 헬스 체크
        sleep 30
        curl -f http://localhost:8000/api/health/ || exit 1
        curl -f http://localhost:3000/ || exit 1
        EOF

    - name: Notify Slack - Staging Deployment
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Staging deployment completed'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author

  production-deploy:
    needs: [build-and-push, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production

    steps:
    - uses: actions/checkout@v3

    - name: Manual Approval for Production
      run: |
        echo "⚠️  Production deployment requires manual approval"
        echo "Images ready:"
        echo "  Consumer: ${{ needs.build-and-push.outputs.consumer-image }}"
        echo "  Backend: ${{ needs.build-and-push.outputs.backend-image }}"
        echo "  Frontend: ${{ needs.build-and-push.outputs.frontend-image }}"

    - name: Deploy to Production (Blue-Green)
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.PROD_DEPLOY_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

        ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} << 'EOF'
        cd /app/news_pipeline
        
        # Blue-Green 배포
        # 1. Green 환경에 새 이미지 배포
        export CONSUMER_IMAGE=${{ secrets.REGISTRY_URL }}/news-consumer:${{ github.sha }}
        export BACKEND_IMAGE=${{ secrets.REGISTRY_URL }}/news-backend:${{ github.sha }}
        export FRONTEND_IMAGE=${{ secrets.REGISTRY_URL }}/news-frontend:${{ github.sha }}
        
        # Green 환경 생성
        docker-compose -f docker-compose.prod.green.yml pull
        docker-compose -f docker-compose.prod.green.yml up -d
        
        # 2. Green 환경 헬스 체크 (최대 5분)
        for i in {1..30}; do
          if curl -f http://localhost:8001/api/health/ > /dev/null 2>&1; then
            echo "✓ Green environment healthy"
            break
          fi
          echo "Waiting for Green environment... ($i/30)"
          sleep 10
        done
        
        # 3. 로드 밸런서 전환 (Blue → Green)
        # Nginx 설정 업데이트
        sed -i 's/upstream app { server blue:8000; }/upstream app { server green:8000; }/' /etc/nginx/conf.d/app.conf
        nginx -s reload
        
        # 4. Blue 환경 모니터링 (30초) - 문제시 롤백
        sleep 30
        if ! curl -f http://localhost:8001/api/health/ > /dev/null 2>&1; then
          echo "❌ Green environment failed, rolling back to Blue"
          sed -i 's/upstream app { server green:8000; }/upstream app { server blue:8000; }/' /etc/nginx/conf.d/app.conf
          nginx -s reload
          docker-compose -f docker-compose.prod.green.yml down
          exit 1
        fi
        
        # 5. Blue 환경 종료
        docker-compose -f docker-compose.prod.blue.yml down
        EOF

    - name: Smoke Tests
      run: |
        sleep 10
        curl -f http://${{ secrets.PROD_HOST }}/api/health/ || exit 1
        curl -f http://${{ secrets.PROD_HOST }}/api/mynews/articles/ || exit 1

    - name: Notify Slack - Production Deployment
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Production deployment completed'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,workflow

  notify-completion:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always()

    steps:
    - name: Send completion notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          Build completed: ${{ github.ref }}
          Commit: ${{ github.sha }}
          Images pushed successfully
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,ref
